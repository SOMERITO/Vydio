services:
  - type: web
    name: vydio-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://somerito.github.io,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500
      - key: MAX_FILE_SIZE_MB
        value: "512"
      - key: MAX_DURATION_SECONDS
        value: "2700"
      - key: MAX_ACTIVE_DOWNLOADS
        value: "2"
      - key: RATE_LIMIT_PER_MINUTE
        value: "12"
      - key: JOB_TTL_SECONDS
        value: "1800"
