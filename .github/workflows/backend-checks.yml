name: Vydio backend checks

on:
  push:
    paths:
      - "backend/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - "app.js"
      - "index.html"
      - "styles.css"
      - ".github/workflows/backend-checks.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Check frontend JavaScript syntax
        run: node --check app.js
      - name: Build backend Docker image (Deno + FFmpeg)
        run: docker build --pull -f backend/Dockerfile -t vydio-api:ci .
